regime_note: >-
  The apis.io `energy_utilities` regulatory regime matched this provider via tags and its
  standards[] shortlist is retail/consumer-energy shaped (green-button, espi, cds-energy,
  cds-common, smart-energy-code, ieee-2030-5, openadr). None of those apply to an
  interstate natural gas transmission MLP. The binding US regime for this surface is FERC
  Order No. 587 with the NAESB WGQ standards it incorporates (the map currently names only
  FERC Order 889 / OASIS, which governs electric transmission). Recorded as an observation
  for rubric evolution; nothing here was stretched to fit the existing shortlist.
