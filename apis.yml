x-identity-corrections:
  date: '2026-09-12'
  website:
    field: common[].Website
    was: https://www.genesis-energy.com
    now: https://www.genesisenergy.com
    basis: >-
      genesis-energy.com (hyphenated) is a PARKED DOMAIN, not Genesis Energy, L.P. It
      returns HTTP 200 with a 114-byte lander-redirect for every path, including a
      negative-control path that cannot exist. The company's own site is
      www.genesisenergy.com — title "A World-Class Midstream Services Provider | Genesis
      Energy", matching this record's description — and www.genlp.com (the L.P.'s
      corporate domain) 301s to it.
  github_organization:
    field: common[].GitHubOrganization
    was: https://github.com/genesis-energy
    now: removed
    basis: >-
      The github.com/genesis-energy organization belongs to Genesis Energy Limited, the
      New Zealand electricity and gas retailer — api.github.com/orgs/genesis-energy
      reports blog https://www.genesisenergy.co.nz/, location "New Zealand", and 0 public
      repositories. Wrong company; there is no GitHub organization for the US midstream
      MLP. github.com/genesisenergy returns 404.
  llms_text:
    field: common[].LlmsText
    was: https://genesis-energy.com/llms.txt
    now: removed
    basis: >-
      Same parked domain. The "200 text/plain 65 bytes" recorded on 2026-08-17 was the
      parking service's robots.txt route, and the same host answers 200 for
      /.well-known/genesis-energy-negative-control-7f3ab91c.json. The real host 404s
      /llms.txt. See llms/genesis-energy-llms-probe.yml.
