aid: genesis-energy
name: Genesis Energy
description: >-
  Genesis Energy, L.P. (NYSE: GEL) is a diversified midstream energy master limited
  partnership headquartered in Houston, Texas. It operates offshore crude oil and natural
  gas pipelines and platforms in the Gulf of Mexico, onshore pipelines and terminals,
  marine transportation for refined products and crude, and a sulfur services and soda ash
  (alkali) chemicals business serving refineries, producers, and industrial and commercial
  customers. It is a pipeline and chemicals operator, not a software vendor: it publishes
  no developer program, no API and no machine-readable API contract. Its only public
  machine-readable surface is the FERC-mandated informational posting website it runs for
  its interstate natural gas pipeline, which serves NAESB WGQ-shaped location and capacity
  data as anonymous file downloads.
